<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>厨房販売率CALC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B1110">
<style>
/* Layout: sticky segmented tabs → one pane at a time; mobile single column, ≥900px dashboard grid */
:root{
  --bg:#0B1110; --card:#17211D; --card2:#1E2A25; --line:#304039;
  --accent:#79CBA4; --ok:#68D9A4; --warn:#F1C75B; --bad:#EF7777;
  --fg:#F5F7F5; --muted:#9CAA9F;
  --ok-bg:rgba(104,217,164,.12); --bad-bg:rgba(239,119,119,.12); --warn-bg:rgba(241,199,91,.12);
  --r:16px; --r-sm:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.wrap{max-width:1200px;margin:0 auto;padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.app-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.app-title h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.01em}
.app-title span{color:var(--muted);font-size:.8rem}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  padding:3px;border-radius:14px;background:rgba(23,33,29,.88);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;transition:background .2s,color .2s}
.tabs button svg{width:19px;height:19px}
.tabs button[aria-selected="true"]{background:var(--card2);color:var(--accent)}
@media (min-width:600px){.tabs button{flex-direction:row;gap:7px;font-size:.88rem}}

.pane{display:flex;flex-direction:column;gap:12px;animation:fade .2s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card2{background:var(--card2);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.eyebrow{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sec-title{font-size:.95rem;font-weight:700;margin:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.8rem}

/* Dashboard header + settings */
.dhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.dhead h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.01em}
.chipline{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.chip b{color:var(--fg);font-weight:600}
details.settings{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.settings summary{list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:.88rem;font-weight:600;cursor:pointer}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.settings[open] summary svg{transform:rotate(180deg)}
.set-body{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600;min-width:0}
.ctl{width:100%;min-height:44px;font-size:16px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--fg)}
.ctl:focus{border-color:var(--accent);outline:none}
.tgt-in{display:flex;align-items:center;gap:6px;color:var(--fg)}
.tgt-in .ctl{text-align:right}
.quick{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-weight:600;font-size:.88rem;padding:8px 12px;transition:background .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B1110}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}

/* Hero */
.hero .val{font-size:clamp(3rem,15vw,4.4rem);font-weight:800;line-height:1;letter-spacing:-.03em;margin:6px 0 10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.hero .meta b{color:var(--fg);font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.bar{position:relative;height:10px;border-radius:999px;background:var(--card2);margin-top:14px;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ok);transition:width .25s ease}
.bar.low i{background:var(--bad)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--fg);transform:translateX(-1px)}
.scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:6px}
.note{font-size:.8rem;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .v{font-size:clamp(1.15rem,5.6vw,1.5rem);font-weight:700;margin-top:4px;line-height:1.2;overflow-wrap:anywhere}
.kpi .v small{font-size:.7em;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .s{font-size:.78rem;margin-top:4px}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-acc{color:var(--accent)}

/* Simulation */
.sim-rows{display:flex;flex-direction:column}
.sim-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sim-row:last-child{border-bottom:0}
.sim-row span:first-child{color:var(--muted);font-size:.88rem}
.sim-row .num{font-weight:600;font-size:1.05rem}
.sim-main{margin-top:6px;border-radius:var(--r-sm);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sim-main.up{background:var(--ok-bg)} .sim-main.down{background:var(--bad-bg)}
.sim-main .lab{font-size:.82rem;font-weight:600}
.sim-main .num{font-size:1.6rem;font-weight:800}
.sim-main.up .num,.sim-main.up .lab{color:var(--ok)} .sim-main.down .num,.sim-main.down .lab{color:var(--bad)}
.foot-note{font-size:.75rem;color:var(--muted);margin:10px 0 0}

/* Chart */
.chart{position:relative;height:190px;margin-top:4px;padding-left:34px}
.chart .grid{position:absolute;left:34px;right:0;border-top:1px dashed var(--line)}
.chart .ylab{position:absolute;left:0;width:28px;text-align:right;font-size:.68rem;color:var(--muted);transform:translateY(-50%)}
.chart .tline{position:absolute;left:34px;right:0;border-top:2px solid var(--fg);opacity:.75;z-index:2}
.chart .tlab{position:absolute;right:0;font-size:.68rem;color:var(--fg);transform:translateY(-120%);background:var(--card);padding:0 4px;border-radius:4px;z-index:3}
.bars{position:absolute;left:34px;right:0;top:0;bottom:0;display:grid;align-items:end;gap:4px}
.bcol{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bcol i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--ok);transition:height .25s ease}
.bcol.low i{background:var(--bad)}
.bcol.bnone i{background:transparent;border:1px dashed var(--line);height:6px!important}
.bcol em{font-style:normal;font-size:.64rem;color:var(--muted);position:absolute;white-space:nowrap}
.xlabs{display:grid;gap:4px;margin-left:34px;margin-top:6px}
.xlabs span{min-width:0;text-align:center;font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Period summary */
.psum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.psum .card2{display:flex;flex-direction:column;gap:4px}
.psum .num{font-size:1.15rem;font-weight:700}

/* Day cards */
.ctx{font-size:.8rem;color:var(--muted);margin:0}
.days{display:flex;flex-direction:column;gap:8px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dcard>button{width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;min-height:44px;display:block}
.dtop{display:flex;align-items:center;gap:10px}
.ddate{font-weight:700;font-size:.98rem;flex:1;min-width:0}
.ddate .sat{color:#8FB4FF} .ddate .sun{color:var(--bad)}
.drate{font-weight:800;font-size:1.25rem}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
.dcard.open .chev{transform:rotate(180deg)}
.dsub{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-top:2px}
.dcard .bar{height:6px;margin-top:8px}
.dcard .bar b{top:-3px;bottom:-3px}
.ddet{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;animation:fade .2s ease}
.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;min-width:0}
.inputs input{width:100%;min-height:44px;font-size:16px;text-align:right;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--fg);font-variant-numeric:tabular-nums}
.inputs input:focus{border-color:var(--accent);outline:none}
.inputs input:placeholder-shown{border-style:dashed}
.inputs .rt{font-size:.72rem;font-weight:600}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dstats .card2{padding:10px 12px}
.dstats .num{font-weight:700;font-size:1rem}
.dstats .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.dstats .wide.up{background:var(--ok-bg)} .dstats .wide.down{background:var(--bad-bg)}
.dstats .wide.up .num{color:var(--ok)} .dstats .wide.down .num{color:var(--bad)}

/* Plans */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .card2{display:flex;flex-direction:column;gap:2px}
.compare .num{font-size:1.25rem;font-weight:800;color:var(--accent)}
.plans{display:grid;grid-template-columns:1fr;gap:12px}
.pcard{display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ptitle b{font-size:1rem}
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--card2);padding:3px;border-radius:12px}
.wd{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:.9rem;transition:background .15s,color .15s}
.wd.on{background:var(--accent);color:#0B1110}
.wd.sat:not(.on){color:#8FB4FF} .wd.sun:not(.on){color:var(--bad)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pstats .card2{display:flex;flex-direction:column;gap:2px}
.pstats .num{font-weight:700;font-size:1.05rem}
.pstats .rec{grid-column:1/-1;border:1px solid rgba(121,203,164,.35)}
.pstats .rec .num{font-size:1.6rem;font-weight:800;color:var(--accent)}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.up{background:var(--ok-bg);color:var(--ok)} .pill.down{background:var(--bad-bg);color:var(--bad)} .pill.none{background:var(--card2);color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:180px;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:var(--r-sm);padding:16px}
.empty svg{width:28px;height:28px;opacity:.7}

/* Photo */
.up-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:#0B1110;font-weight:700;cursor:pointer}
.upbtn svg{width:18px;height:18px}
.prev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
.prev img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.prev .side{display:flex;flex-direction:column;gap:8px;min-width:0}
.status{font-size:.85rem;border-radius:10px;padding:8px 12px;background:var(--card2);color:var(--muted)}
.status.ok{background:var(--ok-bg);color:var(--ok)} .status.err{background:var(--bad-bg);color:var(--bad)} .status.load{color:var(--fg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.review{display:flex;flex-direction:column;gap:8px}
.rv{background:var(--card2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rv .inputs input{background:var(--card)}
.rv-head{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 56px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.zoom img{display:block;width:100%;max-width:none;border-radius:8px}
.zoom.big img{width:220%}
.zoom-bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:51}

/* Desktop dashboard */
@media (min-width:900px){
  .wrap{gap:18px;padding-block:20px 48px}
  .dash{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
  .dash .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .kpis{grid-template-columns:1fr 1fr}
  .set-body{grid-template-columns:repeat(4,1fr)}
  .chart{height:220px}
  .plans{grid-template-columns:1fr 1fr}
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-items:start}
  .psum{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:899px){ .dash,.dash .col{display:flex;flex-direction:column;gap:12px} }
@media (max-width:360px){ .wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))} .card{padding:14px} .kpi{padding:12px} .inputs{gap:6px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="app-title"><h1>厨房販売率CALC</h1><span>まちかど厨房（販売）</span></div>

  <nav class="tabs" role="tablist" aria-label="ページ">
    <button type="button" role="tab" id="tab-sum" data-tab="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>まとめ</button>
    <button type="button" role="tab" id="tab-plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>作成計画</button>
    <button type="button" role="tab" id="tab-day" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>日別</button>
    <button type="button" role="tab" id="tab-photo" data-tab="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>写真</button>
  </nav>

  <!-- まとめ -->
  <div class="pane" id="pane-sum" role="tabpanel">
    <div class="dhead">
      <h2>厨房販売率</h2>
      <div class="chipline">
        <span class="chip">期間 <b id="hPeriod" class="num">–</b></span>
        <span class="chip">目標 <b id="hTarget" class="num">–</b></span>
      </div>
    </div>

    <details class="settings" id="settings">
      <summary>期間・目標を変更<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="set-body">
        <label class="field">はじめ<input class="ctl" type="date" id="from"></label>
        <label class="field">おわり<input class="ctl" type="date" id="to"></label>
        <label class="field">販売率の計算
          <select class="ctl" id="mode">
            <option value="dw">値引＋廃棄</option>
            <option value="w">廃棄だけ</option>
          </select>
        </label>
        <label class="field">目標の販売率
          <span class="tgt-in"><input class="ctl num" type="number" inputmode="decimal" id="target" min="50" max="99" step="1" value="75">%</span>
        </label>
        <div class="quick">
          <button class="btn" id="q1" type="button">10/11〜10/18</button>
          <button class="btn" id="q2" type="button">直近7日</button>
          <button class="btn" id="q3" type="button">全部</button>
        </div>
      </div>
    </details>

    <div id="warn" class="note" hidden></div>

    <div class="dash">
      <div class="col">
        <section class="card hero" aria-label="期間販売率">
          <div class="eyebrow">期間販売率</div>
          <div class="val num" id="sRate">–</div>
          <div class="meta">
            <span>目標 <b class="num" id="sTgt">–</b></span>
            <span>目標との差 <b class="num delta" id="sDelta">–</b></span>
          </div>
          <div class="bar" id="sBar"><i style="width:0"></i><b style="left:75%"></b></div>
          <div class="scale num"><span>0%</span><span>50%</span><span>100%</span></div>
        </section>

        <section class="kpis" aria-label="金額">
          <div class="kpi"><div class="eyebrow">販売高</div><div class="v num" id="kS">–</div><div class="s c-acc num" id="kSr"></div></div>
          <div class="kpi"><div class="eyebrow">値引高</div><div class="v num" id="kD">–</div><div class="s c-warn num" id="kDr"></div></div>
          <div class="kpi"><div class="eyebrow">廃棄高</div><div class="v num" id="kW">–</div><div class="s c-bad num" id="kWr"></div></div>
          <div class="kpi"><div class="eyebrow">作成高</div><div class="v num" id="kM">–</div><div class="s muted small">販売＋値引＋廃棄</div></div>
        </section>
      </div>

      <div class="col">
        <section class="card" aria-label="目標達成シミュレーション">
          <div class="sec-head"><h3 class="sec-title">目標達成シミュレーション</h3><span class="eyebrow num" id="simT"></span></div>
          <div class="sim-rows">
            <div class="sim-row"><span>目標達成に必要な作成高</span><span class="num" id="simNeed">–</span></div>
            <div class="sim-row"><span id="simNowLab">現在の作成高</span><span class="num" id="simNow">–</span></div>
          </div>
          <div class="sim-main" id="simBox"><span class="lab" id="simLab">追加作成可能額</span><span class="num" id="sAdj">–</span></div>
          <p class="foot-note">販売高が今と同じ場合の、計算上の金額です。</p>
        </section>

        <section class="card" aria-label="日別販売率">
          <div class="sec-head"><h3 class="sec-title">日別販売率</h3></div>
          <div id="chart"></div>
        </section>
      </div>
    </div>

    <section aria-label="期間サマリー">
      <div class="psum">
        <div class="card2"><span class="eyebrow">入力済み日数</span><span class="num" id="sDays">–</span></div>
        <div class="card2"><span class="eyebrow">1日平均 販売高</span><span class="num" id="sAvgS">–</span></div>
        <div class="card2"><span class="eyebrow">1日平均 必要作成高</span><span class="num" id="sNeed">–</span><span class="muted small num">今は <span id="sNow">–</span>円</span></div>
        <div class="card2"><span class="eyebrow">1日あたり</span><span class="num" id="sPerDay">–</span></div>
      </div>
    </section>
  </div>

  <!-- 作成計画 -->
  <div class="pane" id="pane-plan" role="tabpanel" hidden>
    <p class="ctx" data-ctx></p>
    <section class="compare" id="compare" aria-label="パターン比較"></section>
    <section class="plans" id="plans" aria-label="作成計画"></section>
  </div>

  <!-- 日別 -->
  <div class="pane" id="pane-day" role="tabpanel" hidden>
    <p class="ctx" data-ctx></p>
    <div class="days" id="rows"></div>
  </div>

  <!-- 写真 -->
  <div class="pane" id="pane-photo" role="tabpanel" hidden>
    <section class="card" aria-label="写真アップ">
      <div class="up-row">
        <label class="upbtn" for="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>写真アップ</label>
        <input type="file" id="photo" accept="image/*" hidden>
      </div>
      <div id="upBody" class="prev" hidden>
        <img id="preview" alt="アップした写真（タップで拡大）">
        <div class="side">
          <button id="readBtn" type="button" class="btn primary">数字を読み取る</button>
          <p id="readMsg" class="status" role="status" hidden></p>
        </div>
      </div>
    </section>

    <section class="card" id="reviewCard" aria-label="読み取った数字の確認" hidden>
      <div class="sec-head"><h3 class="sec-title">読み取った数字の確認</h3><span class="eyebrow" id="rvCount"></span></div>
      <p class="muted small" style="margin:0 0 10px">写真と見くらべて、ちがう数字は直してから反映してください。</p>
      <div class="review" id="review"></div>
      <div class="actions" style="margin-top:12px">
        <button type="button" class="btn ghost" id="rvCancel">やめる</button>
        <button type="button" class="btn primary" id="rvApply">反映する</button>
      </div>
    </section>

    <button class="btn ghost" id="reset" type="button" style="align-self:flex-start">最初の写真の数字に戻す</button>
  </div>
</div>

<div class="zoom" id="zoom" hidden role="dialog" aria-label="写真の拡大">
  <div class="zoom-bar"><button type="button" class="btn" id="zoomToggle">もっと拡大</button><button type="button" class="btn" id="zoomClose">閉じる</button></div>
  <img id="zoomImg" alt="アップした写真">
</div>

<script>
const PHOTO = {
  "2026-10-07":[32767,7025,1290], "2026-10-08":[31504,5729,2884], "2026-10-09":[30288,7278,7216],
  "2026-10-10":[19859,7095,3219], "2026-10-11":[18404,4804,10556],"2026-10-12":[23575,4625,2952],
  "2026-10-13":[32543,4147,1313], "2026-10-14":[27717,9312,1063], "2026-10-15":[29570,7645,1799],
  "2026-10-16":[27926,8645,0]
};
const KEY="kitchen-rate-v1";
let data;
try{ data = JSON.parse(localStorage.getItem(KEY)) || null }catch(e){ data=null }
if(!data) data = JSON.parse(JSON.stringify(PHOTO));
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)) }catch(e){} };

const $=id=>document.getElementById(id);
const yen=n=>Math.round(n).toLocaleString("ja-JP");
const W="日月火水木金土";
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>new Date(s+"T00:00:00Z");
function days(a,b){ const out=[]; for(let d=parse(a); d<=parse(b); d.setUTCDate(d.getUTCDate()+1)) out.push(iso(d)); return out }
function lossOf(v){ return $("mode").value==="dw" ? v[1]+v[2] : v[2] }
function rateOf(v){ const L=lossOf(v); return v[0]+L>0 ? v[0]/(v[0]+L) : null }
let T=0.75;
function adjOf(v){ return v[0]*(1/T-1) - lossOf(v) }
function full(v){ return v && v.every(x=>typeof x==="number" && !isNaN(x)) }
function tgt(){ return +(T*100).toFixed(1) }
function pill(a){
  if(a===null) return '<span class="pill none">—</span>';
  if(Math.abs(a)<1) return `<span class="pill up">ちょうど${tgt()}%</span>`;
  return a<0 ? `<span class="pill down">−${yen(-a)}円 へらす</span>` : `<span class="pill up">＋${yen(a)}円 ふやせる</span>`;
}

// 表示用ヘルパー（計算式は上の関数のまま）
const pct=x=>(x*100).toFixed(1)+"%";
const pt=r=>{ const d=(r-T)*100; return (d>=0?"+":"−")+Math.abs(d).toFixed(1)+"pt" };
const signYen=a=>(a<0?"−":"+")+yen(Math.abs(a))+"円";
const md=s=>{const d=parse(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
function makeAll(v){ return v[0]+v[1]+v[2] } // 作成高＝販売＋値引＋廃棄（値引率・廃棄率の分母）

const SKIP_DAYS={};
function render(opt){
  const list=days($("from").value,$("to").value).slice(0,62);
  let S=0,D=0,Wt=0,n=0; const missing=[];
  list.forEach(ds=>{ const v=data[ds]; if(full(v)){S+=v[0];D+=v[1];Wt+=v[2];n++} else missing.push(ds) });
  const tot=[S,D,Wt]; const r=n?rateOf(tot):null; const a=n?adjOf(tot):null;
  const all=makeAll(tot);

  // ヘッダー
  $("hPeriod").textContent=`${md($("from").value)}〜${md($("to").value)}`;
  $("hTarget").textContent=tgt()+"%";

  // メインKPI
  $("sRate").textContent=r===null?"–":pct(r);
  $("sRate").className="val num "+(r===null?"":r<T?"c-bad":"c-ok");
  $("sTgt").textContent=tgt().toFixed(1)+"%";
  $("sDelta").textContent=r===null?"–":pt(r);
  $("sDelta").className="num delta "+(r===null?"":r<T?"down":"up");
  const bar=$("sBar"); bar.classList.toggle("low",r!==null&&r<T);
  bar.querySelector("i").style.width=(r===null?0:Math.min(100,r*100))+"%";
  bar.querySelector("b").style.left=(T*100)+"%";

  // 金額KPI
  $("kS").innerHTML=n?yen(S)+"<small>円</small>":"–";
  $("kD").innerHTML=n?yen(D)+"<small>円</small>":"–";
  $("kW").innerHTML=n?yen(Wt)+"<small>円</small>":"–";
  $("kM").innerHTML=n?yen(all)+"<small>円</small>":"–";
  $("kSr").textContent=n&&all?"販売率 "+pct(S/all):"";
  $("kDr").textContent=n&&all?"値引率 "+pct(D/all):"";
  $("kWr").textContent=n&&all?"廃棄率 "+pct(Wt/all):"";

  // シミュレーション
  $("simT").textContent="目標 "+tgt()+"%";
  $("simNeed").textContent=n?yen(S/T)+"円":"–";
  $("simNow").textContent=n?yen(S+lossOf(tot))+"円":"–";
  $("simNowLab").textContent=$("mode").value==="dw"?"現在の作成高":"現在の作成高（値引をふくまない）";
  const box=$("simBox"); box.className="sim-main "+(a===null?"":a<0?"down":"up");
  $("simLab").textContent=a!==null&&a<0?"減らす必要がある額":"追加作成可能額";
  $("sAdj").textContent=a===null?"–":signYen(a);

  // 期間サマリー
  $("sDays").textContent=`${n}日 / ${list.length}日`;
  $("sAvgS").textContent=n?yen(S/n)+"円":"–";
  $("sNeed").textContent=n?yen(S/T/n)+"円":"–"; $("sNow").textContent=n?yen((S+lossOf(tot))/n):"–";
  $("sPerDay").textContent=a===null?"–":signYen(a/n);
  $("sPerDay").className="num "+(a===null?"":a<0?"c-bad":"c-ok");

  const w=$("warn");
  if(missing.length){ w.hidden=false; w.textContent=`${missing.map(md).join("・")} の数字がまだありません。写真タブか日別タブで入力してください。`; }
  else w.hidden=true;

  renderChart(list);
  if(opt!==SKIP_DAYS) renderDays(list);
  renderPlans(list);
  document.querySelectorAll("[data-ctx]").forEach(e=>e.textContent=`期間 ${md($("from").value)}〜${md($("to").value)}・目標${tgt()}%（まとめタブで変更）`);
}

// グラフ（ライブラリなし）
function renderChart(list){
  const el=$("chart");
  const pts=list.map(ds=>({ds,r:full(data[ds])?rateOf(data[ds]):null}));
  if(!pts.some(p=>p.r!==null)){ el.innerHTML='<div class="empty">この期間のデータはまだありません</div>'; return }
  const every=Math.ceil(pts.length/10);
  let h='<div class="chart">';
  [0,25,50,75,100].forEach(v=>{ h+=`<div class="grid" style="top:${100-v}%"></div><span class="ylab num" style="top:${100-v}%">${v}</span>` });
  h+=`<div class="tline" style="top:${100-T*100}%"></div><span class="tlab num" style="top:${100-T*100}%">目標 ${tgt()}%</span><div class="bars" style="grid-template-columns:repeat(${pts.length},minmax(0,1fr))">`;
  pts.forEach(p=>{
    if(p.r===null){ h+=`<div class="bcol bnone" title="${md(p.ds)} 未入力"><i></i></div>`; return }
    const hp=Math.max(0,Math.min(100,p.r*100));
    h+=`<div class="bcol ${p.r<T?'low':''}" title="${md(p.ds)} ${pct(p.r)}"><i style="height:${hp}%"></i>${pts.length<=10?`<em class="num" style="bottom:calc(${hp}% + 2px)">${(p.r*100).toFixed(0)}</em>`:''}</div>`;
  });
  h+=`</div></div><div class="xlabs" style="grid-template-columns:repeat(${pts.length},minmax(0,1fr))">`;
  pts.forEach((p,i)=>{ const d=parse(p.ds); h+=`<span class="num">${i%every===0?`${d.getUTCMonth()+1}/${d.getUTCDate()}`:''}</span>` });
  h+=`</div><div class="legend"><span><i style="background:var(--ok)"></i>目標以上</span><span><i style="background:var(--bad)"></i>目標未満</span><span><i style="background:transparent;border:1px dashed var(--line)"></i>未入力</span></div>`;
  el.innerHTML=h;
}

// 日別（アコーディオン）
const OPEN=new Set();
function dayHead(ds){
  const v=data[ds], d=parse(ds), wd=d.getUTCDay(), ok=full(v), r=ok?rateOf(v):null;
  return `<div class="dtop"><span class="ddate"><span class="${wd===6?'sat':wd===0?'sun':''}">${d.getUTCMonth()+1}/${d.getUTCDate()}（${W[wd]}）</span></span>
    <span class="drate num ${r===null?'muted':r<T?'c-bad':'c-ok'}">${r===null?'未入力':pct(r)}</span>${CHEV}</div>
    <div class="dsub"><span class="num">${r===null?'タップして入力':'目標 '+pt(r)}</span><span class="num">${ok?'作成高 '+yen(v[0]+lossOf(v))+'円':''}</span></div>
    <div class="bar ${r!==null&&r<T?'low':''}"><i style="width:${r===null?0:Math.min(100,r*100)}%"></i><b style="left:${T*100}%"></b></div>`;
}
function dayStats(ds){
  const v=data[ds], ok=full(v);
  if(!ok) return '<p class="muted small" style="margin:0">3つの数字を入れると計算します。</p>';
  const all=makeAll(v), a=adjOf(v);
  return `<div class="card2"><span class="eyebrow">現在の作成高</span><div class="num">${yen(v[0]+lossOf(v))}円</div></div>
    <div class="card2"><span class="eyebrow">目標作成高</span><div class="num">${yen(v[0]/T)}円</div></div>
    <div class="card2 wide ${a<0?'down':'up'}"><span class="eyebrow">${a<0?'減らす必要がある額':'追加作成可能額'}</span><span class="num">${signYen(a)}</span></div>`;
}
function dayRates(ds){
  const v=data[ds]; if(!full(v)) return ["","",""];
  const all=makeAll(v);
  return all?["販売率 "+pct(v[0]/all),"値引率 "+pct(v[1]/all),"廃棄率 "+pct(v[2]/all)]:["","",""];
}
function renderDays(list){
  const box=$("rows"); box.innerHTML="";
  list.forEach(ds=>{
    const v=data[ds], open=OPEN.has(ds), rt=dayRates(ds);
    const c=document.createElement("div"); c.className="dcard"+(open?" open":""); c.dataset.ds=ds;
    const inp=(i,lab,cls)=>`<label for="in-${ds}-${i}">${lab}<input id="in-${ds}-${i}" inputmode="numeric" enterkeyhint="next" autocomplete="off" placeholder="未入力" value="${v&&typeof v[i]==='number'?yen(v[i]):''}" data-d="${ds}" data-i="${i}"><span class="rt ${cls} num" data-rt="${i}">${rt[i]}</span></label>`;
    c.innerHTML=`<button type="button" class="dhead-btn" aria-expanded="${open}" data-toggle="${ds}">${dayHead(ds)}</button>
      <div class="ddet" ${open?'':'hidden'}>
        <div class="inputs">${inp(0,"販売高","c-acc")}${inp(1,"値引高","c-warn")}${inp(2,"廃棄高","c-bad")}</div>
        <div class="dstats">${dayStats(ds)}</div>
      </div>`;
    box.appendChild(c);
  });
}
function updateDayCard(ds){
  const c=document.querySelector(`.dcard[data-ds="${ds}"]`); if(!c) return;
  c.querySelector("[data-toggle]").innerHTML=dayHead(ds);
  c.querySelector(".dstats").innerHTML=dayStats(ds);
  const rt=dayRates(ds); c.querySelectorAll("[data-rt]").forEach(e=>e.textContent=rt[+e.dataset.rt]);
}
$("rows").addEventListener("click",e=>{
  const b=e.target.closest("[data-toggle]"); if(!b) return;
  const ds=b.dataset.toggle, c=b.parentElement, open=!OPEN.has(ds);
  open?OPEN.add(ds):OPEN.delete(ds);
  c.classList.toggle("open",open); b.setAttribute("aria-expanded",open); c.querySelector(".ddet").hidden=!open;
});

// 写真アップ・読み取り
let photoFile=null, sampleFn=null, pending=[];
function setMsg(t,kind){ const m=$("readMsg"); m.hidden=!t; m.className="status "+(kind||""); m.innerHTML=t||"" }
$("photo").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  photoFile=f; const url=URL.createObjectURL(f); $("preview").src=url; $("zoomImg").src=url; $("upBody").hidden=false;
  setMsg(sampleFn ? "「数字を読み取る」を押してください。" : "", "");
});
(async()=>{
  try{
    const s=window.claude && await claude.use("sample");
    if(!s) throw 0;
    const lim=await s.limits().catch(()=>null);
    if(!lim||!lim.images) throw 0;
    sampleFn=s;
  }catch(e){ $("readBtn").hidden=true }
})();
$("readBtn").onclick=async()=>{
  if(!photoFile||!sampleFn) return;
  const btn=$("readBtn"); btn.disabled=true; setMsg('<span class="spin"></span>読み取り中…（30秒ほどかかることがあります）',"load");
  const prompt=`この写真はコンビニのPOS「WinShare」の画面です。上の行に日付（例 2026/10/16）が並んでいます。
「まちかど厨房（販売）」の行（黄色の部分）から、日付ごとに 販売高・値引高・廃棄高 を読み取ってください。
「仕入高」は不要です。「まちかど厨房（食材）」「（包材）」「（廃棄）」の行は使わないでください。
年が「20XX/10/ 7」のように空白がある場合も YYYY-MM-DD にしてください。読めない数字は null。
次のJSONだけで答えてください：
{"days":[{"date":"2026-10-16","sales":27926,"discount":8645,"waste":0}]}`;
  try{
    const res=await sampleFn.json(prompt,{images:photoFile,modelTier:"complex"});
    const days=(res&&Array.isArray(res.days))?res.days:[];
    pending=[];
    days.forEach(d=>{
      const ds=String(d.date||"").slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
      const num=x=>(x===null||x===undefined||x==="")?null:Number(String(x).replace(/,/g,""));
      pending.push({ds,v:[num(d.sales),num(d.discount),num(d.waste)]});
    });
    if(!pending.length){ setMsg("数字を読み取れませんでした。画面全体がはっきり写った写真でもう一度ためすか、日別タブで直接入力してください。","err"); return }
    pending.sort((x,y)=>x.ds<y.ds?-1:1);
    showReview();
    setMsg(`${pending.length}日分を読み取りました。下で確認してから「反映する」を押してください。`,"ok");
  }catch(e){
    const c=e&&e.code;
    setMsg( c==="not_granted"||c==="sampling_disabled" ? "読み取りが許可されていません。写真を見ながら日別タブで入力してください。"
      : c==="rate_limited" ? "混み合っています。少し待ってからもう一度押してください。"
      : c==="image_rejected" ? "この写真は使えませんでした。別の写真を選んでください。"
      : "うまく読み取れませんでした。もう一度押すか、日別タブで直接入力してください。","err");
    if(c==="not_granted"||c==="sampling_disabled") btn.hidden=true;
  }finally{ btn.disabled=false }
};
function showReview(){
  const box=$("review"); box.innerHTML="";
  pending.forEach((p,k)=>{
    const d=parse(p.ds), had=full(data[p.ds]);
    const inp=(i,lab)=>`<label for="rv-${k}-${i}">${lab}<input id="rv-${k}-${i}" inputmode="numeric" autocomplete="off" placeholder="未入力" value="${p.v[i]===null||isNaN(p.v[i])?'':yen(p.v[i])}" data-rv="${k}" data-i="${i}"></label>`;
    const el=document.createElement("div"); el.className="rv";
    el.innerHTML=`<div class="rv-head"><span>${d.getUTCMonth()+1}/${d.getUTCDate()}（${W[d.getUTCDay()]}）</span><span class="muted small">${had?'今の数字を上書き':'新しい日'}</span></div>
      <div class="inputs">${inp(0,"販売高")}${inp(1,"値引高")}${inp(2,"廃棄高")}</div>`;
    box.appendChild(el);
  });
  $("rvCount").textContent=pending.length+"日分";
  $("reviewCard").hidden=false;
}
$("review").addEventListener("change",e=>{
  const t=e.target; if(t.dataset.rv===undefined) return;
  const raw=cleanNum(t.value); pending[+t.dataset.rv].v[+t.dataset.i]= raw===""?null:Number(raw);
  t.value= raw===""?"":yen(Number(raw));
});
$("rvCancel").onclick=()=>{ pending=[]; $("reviewCard").hidden=true; setMsg("反映をやめました。","") };
$("rvApply").onclick=()=>{
  if(!pending.length) return;
  const got=[];
  pending.forEach(p=>{ data[p.ds]=p.v.slice(); got.push(p.ds) });
  got.sort(); save();
  const cur0=$("from").value, cur1=$("to").value;
  setRange(got[0]<cur0?got[0]:cur0, got[got.length-1]>cur1?got[got.length-1]:cur1);
  pending=[]; $("reviewCard").hidden=true;
  setMsg(`${got.length}日分を反映しました（${md(got[0])}〜${md(got[got.length-1])}）。まとめタブで確認できます。`,"ok");
};
$("preview").onclick=()=>{ $("zoom").hidden=false; document.body.style.overflow="hidden" };
$("zoomClose").onclick=()=>{ $("zoom").hidden=true; $("zoom").classList.remove("big"); $("zoomToggle").textContent="もっと拡大"; document.body.style.overflow="" };
$("zoomToggle").onclick=()=>{ const b=$("zoom").classList.toggle("big"); $("zoomToggle").textContent=b?"元の大きさ":"もっと拡大" };

// 作成計画（曜日パターン）
let PLANS=[{name:"パターンA",days:[1,2,3,4,5]},{name:"パターンB",days:[0,6]}];
try{ const p=JSON.parse(localStorage.getItem("kitchen-plans")); if(Array.isArray(p)&&p.length===2) PLANS=p }catch(e){}
const savePlans=()=>{ try{ localStorage.setItem("kitchen-plans",JSON.stringify(PLANS)) }catch(e){} };
function planStats(pl,list){
  const rows=list.filter(ds=>full(data[ds]) && pl.days.includes(parse(ds).getUTCDay())).map(ds=>data[ds]);
  const k=rows.length;
  const S=rows.reduce((t,v)=>t+v[0],0), L=rows.reduce((t,v)=>t+lossOf(v),0);
  return {k,S,L,need:k?S/T/k:0,now:k?(S+L)/k:0,rate:k&&S+L>0?S/(S+L):null};
}
function renderPlans(list){
  const box=$("plans"); box.innerHTML=""; const cmp=$("compare"); cmp.innerHTML="";
  PLANS.forEach((pl,pi)=>{
    const st=planStats(pl,list), diff=st.need-st.now;
    const names=[1,2,3,4,5,6,0].filter(d=>pl.days.includes(d)).map(d=>W[d]).join("・")||"曜日なし";
    cmp.insertAdjacentHTML("beforeend",`<div class="card2"><span class="eyebrow">${pl.name}（${names}）</span><span class="num">${st.k?yen(st.need)+'円':'—'}</span><span class="muted small">1日の推奨作成高</span></div>`);
    const c=document.createElement("section"); c.className="card pcard";
    c.innerHTML=`<div class="ptitle"><b>${pl.name}</b><span class="muted small">${names}</span></div>
      <div class="wds" role="group" aria-label="${pl.name}の曜日">${[1,2,3,4,5,6,0].map(d=>`<button type="button" id="wd-${pi}-${d}" class="wd ${d===6?'sat':d===0?'sun':''} ${pl.days.includes(d)?'on':''}" data-p="${pi}" data-d="${d}" aria-pressed="${pl.days.includes(d)}">${W[d]}</button>`).join("")}</div>
      ${st.k?`<div class="pstats">
        <div class="card2 rec"><span class="eyebrow">推奨作成高（1日平均・目標${tgt()}%）</span><span class="num">${yen(st.need)}円</span></div>
        <div class="card2"><span class="eyebrow">平均販売高</span><span class="num">${yen(st.S/st.k)}円</span></div>
        <div class="card2"><span class="eyebrow">平均販売率</span><span class="num ${st.rate<T?'c-bad':'c-ok'}">${pct(st.rate)}</span></div>
        <div class="card2"><span class="eyebrow">今の作成高（平均）</span><span class="num">${yen(st.now)}円</span></div>
        <div class="card2"><span class="eyebrow">過去実績</span><span class="num">${st.k}日</span></div>
        <div class="card2" style="grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center"><span class="eyebrow">今より</span>${pill(diff)}</div>
      </div>`
      :`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${pl.days.length?'この曜日のデータはまだありません':'曜日を選んでください'}</div>`}`;
    box.appendChild(c);
  });
}
$("plans").addEventListener("click",e=>{
  const b=e.target.closest(".wd"); if(!b) return;
  const pi=+b.dataset.p, d=+b.dataset.d, other=1-pi;
  const on=PLANS[pi].days.includes(d);
  PLANS[pi].days = on ? PLANS[pi].days.filter(x=>x!==d) : [...PLANS[pi].days,d];
  if(!on) PLANS[other].days=PLANS[other].days.filter(x=>x!==d);
  savePlans(); render();
});

// タブ
const TABS=["sum","plan","day","photo"];
function showTab(t){
  if(!TABS.includes(t)) t="sum";
  TABS.forEach(x=>{ $("pane-"+x).hidden = x!==t; $("tab-"+x).setAttribute("aria-selected", x===t) });
  try{ localStorage.setItem("kitchen-tab",t) }catch(e){}
}
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ showTab(b.dataset.tab); window.scrollTo({top:0}) } });
let firstTab=(location.hash||"").slice(1); if(!TABS.includes(firstTab)){ try{ firstTab=localStorage.getItem("kitchen-tab") }catch(e){} }
showTab(firstTab||"sum");

// 数字入力（日別）
function cleanNum(s){ return String(s).replace(/[,，円\s]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)) }
$("rows").addEventListener("change",e=>{
  const t=e.target; if(!t.dataset.d) return;
  const raw=cleanNum(t.value);
  const ds=t.dataset.d, i=+t.dataset.i;
  data[ds]=data[ds]||[null,null,null];
  data[ds][i]= raw===""?null:Number(raw);
  if(data[ds].every(x=>x===null)) delete data[ds];
  t.value= raw===""?"":yen(Number(raw));
  save();
  // 日別カードはその場で更新（入力中のカードを閉じない）
  updateDayCard(ds);
  render(SKIP_DAYS);
});
function setRange(a,b){ $("from").value=a; $("to").value=b; render() }
try{ const t=+localStorage.getItem("kitchen-target"); if(t>=50&&t<100){ T=t/100; $("target").value=t } }catch(e){}
$("target").addEventListener("input",()=>{ const t=+$("target").value; if(t>=50&&t<100){ T=t/100; try{localStorage.setItem("kitchen-target",t)}catch(e){} render() } });
$("from").addEventListener("change",render); $("to").addEventListener("change",render); $("mode").addEventListener("change",render);
$("q1").onclick=()=>setRange("2026-10-11","2026-10-18");
$("q2").onclick=()=>{ const keys=Object.keys(data).sort(); const last=keys[keys.length-1]||"2026-10-16"; const d=parse(last); d.setUTCDate(d.getUTCDate()-6); setRange(iso(d),last) };
$("q3").onclick=()=>{ const keys=Object.keys(data).sort(); setRange(keys[0],keys[keys.length-1]) };
let resetArm=null;
$("reset").onclick=()=>{
  const b=$("reset");
  if(!resetArm){ b.textContent="もう一度押すと、最初の写真の数字に戻します"; b.classList.add("c-bad"); resetArm=setTimeout(()=>{ resetArm=null; b.textContent="最初の写真の数字に戻す"; b.classList.remove("c-bad") },4000); return }
  clearTimeout(resetArm); resetArm=null; b.textContent="最初の写真の数字に戻す"; b.classList.remove("c-bad");
  data=JSON.parse(JSON.stringify(PHOTO)); save(); render();
};
setRange("2026-10-11","2026-10-18");

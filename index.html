<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>厨房販売率CALC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
.tgt-in{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:1rem}
#target{width:4.5em;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--mustard);border-radius:6px;padding:5px 8px;text-align:right}
*,*::before,*::after{box-sizing:border-box}
.tile .val.tot{font-size:1rem;display:flex;flex-direction:column;line-height:1.5}
.plan h2{margin-bottom:10px}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pname{font-weight:900;font-size:1rem}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{padding:8px 0;font-weight:700;font-size:.95rem;text-align:center;border-radius:6px;background:var(--panel)}
.wd.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.wd.sat:not(.on){color:#3a6fd8}.wd.sun:not(.on){color:var(--bad)}
.pneed{background:var(--mustard-soft);border:1px solid var(--mustard);border-radius:8px;padding:10px 12px}
.pneed .lab{font-size:.78rem;color:var(--muted)}
.pneed .big{font-family:var(--f-num);font-weight:700;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.2}
.prow{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.92rem}
.prow span:first-child{color:var(--muted);font-family:var(--f-display)}
.pempty{color:var(--muted);font-size:.9rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 4px 12px -8px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{border:0;background:transparent;padding:10px 4px;font-weight:700;font-size:.95rem;color:var(--muted);border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.pane{display:flex;flex-direction:column;gap:inherit}
.wrap>.pane{gap:18px}
.ctx{margin:0;color:var(--muted);font-size:.85rem}
@media (max-width:640px){.wrap>.pane{gap:12px}}
/* Layout: one column tool — period bar → summary → daily table */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1d2a22; --muted:#5d6b62; --line:#d9e0d8;
  --accent:#2f6b47; --mustard:#e2c42a; --mustard-soft:#fbf3c4;
  --good:#1f7a4a; --good-bg:#e1f2e8; --bad:#b63a2b; --bad-bg:#f8e3df;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a16; --panel:#1c241f; --ink:#e7eee9; --muted:#9fb0a5; --line:#2e3a33;
  --accent:#7cc39a; --mustard:#e2c42a; --mustard-soft:#3a3514;
  --good:#7fd6a3; --good-bg:#18392a; --bad:#ff9a8a; --bad-bg:#45221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1c241f; --ink:#e7eee9; --muted:#9fb0a5; --line:#2e3a33;
  --accent:#7cc39a; --mustard:#e2c42a; --mustard-soft:#3a3514;
  --good:#7fd6a3; --good-bg:#18392a; --bad:#ff9a8a; --bad-bg:#45221d; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{font-size:1.6rem;font-weight:900;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
input[type=date],select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile.key{background:var(--mustard-soft);border-color:var(--mustard)}
.tile .lab{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.tile .val{font-family:var(--f-num);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .note{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:99px}
.pill.up{background:var(--good-bg);color:var(--good)}
.pill.down{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--line);color:var(--muted)}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:900px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em;background:var(--bg)}
td.date,th.date{text-align:left}
.sat{color:#3a6fd8}.sun{color:var(--bad)}
td input{width:7.5em;font:inherit;text-align:right;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 6px}
td input:hover{border-color:var(--line)}
td input:focus{border-color:var(--accent);background:var(--bg);outline:none}
td input:placeholder-shown{background:var(--mustard-soft)}
.ratecell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter{position:relative;width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter b{position:absolute;top:0;bottom:0;left:var(--target,75%);width:2px;background:var(--mustard)}
tr.low .meter i{background:var(--bad)}
.rate{min-width:3.6em;font-weight:700}
tr.low .rate{color:var(--bad)}
td.need,th.need{background:var(--mustard-soft);font-weight:700}
tfoot td{font-weight:700;background:var(--bg)}
.warn{background:var(--mustard-soft);border:1px solid var(--mustard);border-radius:8px;padding:10px 14px;font-size:.9rem}
.how{font-size:.88rem;color:var(--muted)}
.how p{margin:.3em 0;max-width:65ch}
code{font-family:var(--f-num);background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--ink)}
[hidden]{display:none!important}
h2{font-size:1.1rem;font-weight:900;margin:0}
.up-panel{border-color:var(--mustard);border-width:2px}
.up-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.up-head>div{min-width:0;flex:1 1 260px}
.upbtn{display:inline-block;cursor:pointer;background:var(--accent);color:var(--panel);font-weight:700;padding:10px 20px;border-radius:8px;font-size:1rem}
.upbtn:hover{filter:brightness(1.1)}
#photo:focus-visible+.upbtn,.upbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.up-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;margin-top:14px;align-items:start}
@media (max-width:640px){.up-body{grid-template-columns:1fr}}
#preview{width:100%;max-height:360px;object-fit:contain;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.up-side{display:flex;flex-direction:column;gap:8px}
button.primary{background:var(--mustard);border-color:var(--mustard);color:#1d2a22;font-weight:700;padding:10px 14px;font-size:1rem}
button:disabled{opacity:.6;cursor:wait}
.memo{white-space:pre-wrap;font-family:var(--f-display);font-size:.95rem;margin:10px 0 0;background:var(--bg);border-radius:8px;padding:12px 14px;line-height:1.8}
@media (max-width:640px){
  h1{font-size:1.35rem}
  .wrap{gap:12px;padding-block:12px 32px}
  .panel{padding:12px}
  .up-head{display:block}
  .upbtn{display:block;text-align:center;padding:14px;font-size:1.1rem}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bar .field{min-width:0}
  .bar .chips{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bar .chips button{padding:10px 4px;font-size:.9rem}
  .tgt-in{width:100%}
  #target{flex:1;width:auto;font-size:16px}
  .tile .note{display:none}
  .tile.key .note{display:block}
  .tile .lab{font-size:.75rem}
  .tile.key .val{font-size:2.2rem}
  .summary{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px 12px}
  .tile .val{font-size:1.35rem}
  .tile.key{grid-column:1/-1}
  .bar input[type=date],.bar select{width:100%;font-size:16px}
  .chips button{padding:10px 14px;font-size:.95rem}
  .tablebox{overflow:visible;background:transparent;border:0}
  table{min-width:0;display:block}
  thead{display:none}
  tbody,tfoot{display:flex;flex-direction:column;gap:10px}
  tfoot{margin-top:10px}
  tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  tr.low{border-color:var(--bad);border-width:2px}
  td{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;padding:4px 2px;text-align:left;white-space:normal;min-width:0;background:transparent}
  td::before{content:attr(data-label);font-family:var(--f-display);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
  td.date{grid-column:1/-1;flex-direction:row;font-size:1.05rem;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
  td.date::before{display:none}
  td:nth-child(5){grid-column:1/-1}
  td:nth-child(5) .ratecell{width:100%;justify-content:flex-start}
  td:nth-child(5) .meter{flex:1;height:10px}
  td input{width:100%;font-size:16px;padding:8px 6px;border-color:var(--line);background:var(--bg);text-align:right}
  td.need{background:var(--mustard-soft);border-radius:6px;padding:4px 6px}
  tfoot td{background:transparent}
  tfoot td.need{background:var(--mustard-soft)}
  .pill{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>厨房販売率CALC</h1>
  </header>

  <nav class="tabs" role="tablist" aria-label="ページ">
    <button type="button" role="tab" id="tab-sum" data-tab="sum">まとめ</button>
    <button type="button" role="tab" id="tab-plan" data-tab="plan">作成計画</button>
    <button type="button" role="tab" id="tab-day" data-tab="day">日別</button>
    <button type="button" role="tab" id="tab-photo" data-tab="photo">写真</button>
  </nav>

  <div class="pane" id="pane-sum" role="tabpanel">
    <section class="panel bar" aria-label="期間">
      <label class="field">はじめ<input type="date" id="from"></label>
      <label class="field">おわり<input type="date" id="to"></label>
      <label class="field">販売率の計算
        <select id="mode">
          <option value="dw">値引＋廃棄</option>
          <option value="w">廃棄だけ</option>
        </select>
      </label>
      <label class="field">目標の販売率
        <span class="tgt-in"><input type="number" id="target" min="50" max="99" step="1" value="75">%</span>
      </label>
      <div class="chips">
        <button id="q1" type="button">10/11〜10/18</button>
        <button id="q2" type="button">直近7日</button>
        <button id="q3" type="button">全部</button>
      </div>
    </section>
    <div id="warn" class="warn" hidden></div>
    <section class="summary" aria-label="期間の結果">
      <div class="tile key"><div class="lab">期間の販売率</div><div class="val" id="sRate">–</div><div class="note" id="sDays"></div></div>
      <div class="tile"><div class="lab"><span class="tg">75</span>%まで（期間）</div><div class="val" id="sAdj">–</div><div class="note" id="sAdjNote"></div></div>
      <div class="tile"><div class="lab">1日の必要作成高</div><div class="val" id="sNeed">–</div><div class="note">今は平均 <span id="sNow">–</span>円</div></div>
      <div class="tile"><div class="lab">1日あたり</div><div class="val" id="sPerDay">–</div><div class="note">期間合計 ÷ 入力のある日数</div></div>
      <div class="tile"><div class="lab">期間合計（円）</div><div class="val tot" id="sTot">–</div></div>
    </section>
  </div>

  <div class="pane" id="pane-plan" role="tabpanel" hidden>
    <p class="ctx" data-ctx></p>
    <section class="panel plan" aria-label="作成計画">
      <h2>作成計画（曜日べつ）</h2>
      <div class="plan-grid" id="plans"></div>
    </section>
  </div>

  <div class="pane" id="pane-day" role="tabpanel" hidden>
    <p class="ctx" data-ctx></p>
    <div class="tablebox">
      <table>
        <thead><tr>
          <th class="date">日付</th><th>販売高</th><th>値引高</th><th>廃棄高</th><th>販売率（線＝<span class="tg">75</span>%）</th><th><span class="tg">75</span>%まで</th><th>今の作成高</th><th class="need">必要な作成高</th>
        </tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr id="foot"></tr></tfoot>
      </table>
    </div>
  </div>

  <div class="pane" id="pane-photo" role="tabpanel" hidden>
    <section class="panel up-panel" aria-label="写真アップ">
      <div class="up-head">
        <label class="upbtn" for="photo">写真アップ</label>
        <input type="file" id="photo" accept="image/*" hidden>
      </div>
      <div id="upBody" class="up-body" hidden>
        <img id="preview" alt="アップした写真">
        <div class="up-side">
          <button id="readBtn" type="button" class="primary">数字を読み取る</button>
          <p id="readMsg" class="sub" role="status"></p>
        </div>
      </div>
    </section>
    <div class="chips">
      <button id="reset" type="button">最初の写真の数字に戻す</button>
    </div>
  </div>
</div>

<script>
const PHOTO = {
  "2026-10-07":[32767,7025,1290], "2026-10-08":[31504,5729,2884], "2026-10-09":[30288,7278,7216],
  "2026-10-10":[19859,7095,3219], "2026-10-11":[18404,4804,10556],"2026-10-12":[23575,4625,2952],
  "2026-10-13":[32543,4147,1313], "2026-10-14":[27717,9312,1063], "2026-10-15":[29570,7645,1799],
  "2026-10-16":[27926,8645,0]
};
const KEY="kitchen-rate-v1";
let data;
try{ data = JSON.parse(localStorage.getItem(KEY)) || null }catch(e){ data=null }
if(!data) data = JSON.parse(JSON.stringify(PHOTO));
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)) }catch(e){} };

const $=id=>document.getElementById(id);
const yen=n=>Math.round(n).toLocaleString("ja-JP");
const W="日月火水木金土";
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>new Date(s+"T00:00:00Z");
function days(a,b){ const out=[]; for(let d=parse(a); d<=parse(b); d.setUTCDate(d.getUTCDate()+1)) out.push(iso(d)); return out }
function lossOf(v){ return $("mode").value==="dw" ? v[1]+v[2] : v[2] }
function rateOf(v){ const L=lossOf(v); return v[0]+L>0 ? v[0]/(v[0]+L) : null }
let T=0.75;
function adjOf(v){ return v[0]*(1/T-1) - lossOf(v) }
function full(v){ return v && v.every(x=>typeof x==="number" && !isNaN(x)) }
function pill(a){
  if(a===null) return '<span class="pill none">—</span>';
  if(Math.abs(a)<1) return `<span class="pill up">ちょうど${tgt()}%</span>`;
  return a<0 ? `<span class="pill down">−${yen(-a)}円 へらす</span>` : `<span class="pill up">＋${yen(a)}円 ふやせる</span>`;
}

function tgt(){ return +(T*100).toFixed(1) }
const LABELS=["日付","販売高","値引高","廃棄高","販売率","目標まで","今の作成高","必要な作成高"];
function label(tr){ [...tr.children].forEach((td,i)=>td.dataset.label=LABELS[i]) }
function render(){
  document.querySelectorAll(".tg").forEach(e=>e.textContent=tgt());
  document.documentElement.style.setProperty("--target",(T*100)+"%");
  const list=days($("from").value,$("to").value).slice(0,62);
  const tb=$("rows"); tb.innerHTML="";
  let S=0,D=0,Wt=0,n=0; const missing=[];
  list.forEach(ds=>{
    const v=data[ds]; const d=parse(ds); const wd=d.getUTCDay();
    const ok=full(v); if(ok){S+=v[0];D+=v[1];Wt+=v[2];n++} else missing.push(ds);
    const r=ok?rateOf(v):null, a=ok?adjOf(v):null;
    const tr=document.createElement("tr"); if(r!==null&&r<T) tr.className="low";
    const cell=(i)=>`<td><input id="in-${ds}-${i}" inputmode="numeric" placeholder="未入力" value="${v&&typeof v[i]==='number'?yen(v[i]):''}" data-d="${ds}" data-i="${i}" aria-label="${ds} ${['販売高','値引高','廃棄高'][i]}"></td>`;
    tr.innerHTML=`<td class="date ${wd===6?'sat':wd===0?'sun':''}">${d.getUTCMonth()+1}/${d.getUTCDate()}（${W[wd]}）</td>${cell(0)}${cell(1)}${cell(2)}
      <td><div class="ratecell"><div class="meter"><i style="width:${r===null?0:Math.min(100,r*100)}%"></i><b></b></div><span class="rate">${r===null?'—':(r*100).toFixed(1)+'%'}</span></div></td>
      <td>${pill(a)}</td><td>${ok?yen(v[0]+lossOf(v)):"—"}</td><td class="need">${ok?yen(v[0]/T):"—"}</td>`;
    label(tr); tb.appendChild(tr);
  });
  const tot=[S,D,Wt]; const r=n?rateOf(tot):null; const a=n?adjOf(tot):null;
  $("foot").innerHTML=`<td class="date">合計（${n}日）</td><td>${yen(S)}</td><td>${yen(D)}</td><td>${yen(Wt)}</td><td><span class="rate">${r===null?'—':(r*100).toFixed(1)+'%'}</span></td><td>${pill(a)}</td><td>${yen(S+(n?lossOf(tot):0))}</td><td class="need">${n?yen(S/T):"—"}</td>`;
  label($("foot"));
  $("sRate").textContent=r===null?"–":(r*100).toFixed(1)+"%";
  $("sRate").style.color=r!==null&&r<T?"var(--bad)":"var(--good)";
  $("sDays").textContent=`入力のある ${n}日 / 期間 ${list.length}日`;
  $("sAdj").innerHTML=a===null?"–":(a<0?`−${yen(-a)}円`:`＋${yen(a)}円`);
  $("sAdj").style.color=a!==null&&a<0?"var(--bad)":"var(--good)";
  $("sAdjNote").textContent=a===null?"":(a<0?"作る量・ロスをこれだけ減らす":`これだけ多く作っても${tgt()}%以上`);
  $("sNeed").textContent=n?yen(S/T/n)+"円":"–"; $("sNow").textContent=n?yen((S+lossOf(tot))/n):"–";
  $("sPerDay").textContent=a===null?"–":(a<0?`−${yen(-a/n)}円`:`＋${yen(a/n)}円`);
  $("sTot").innerHTML=`<span>販売 ${yen(S)}</span><span>値引 ${yen(D)}</span><span>廃棄 ${yen(Wt)}</span>`;
  const w=$("warn");
  if(missing.length){ w.hidden=false; w.textContent=`${missing.map(s=>{const d=parse(s);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}).join("・")} の数字がまだありません。写真アップか、黄色の欄に入力してください。`; }
  else w.hidden=true;
  renderPlans(list);
  const f=parse($("from").value), t2=parse($("to").value);
  document.querySelectorAll("[data-ctx]").forEach(e=>e.textContent=`期間 ${f.getUTCMonth()+1}/${f.getUTCDate()}〜${t2.getUTCMonth()+1}/${t2.getUTCDate()}・目標${tgt()}%（まとめタブで変更）`);
}

// 写真アップ・読み取り
let photoFile=null, sampleFn=null;
$("photo").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  photoFile=f; $("preview").src=URL.createObjectURL(f); $("upBody").hidden=false;
  $("readMsg").textContent = sampleFn ? "「数字を読み取る」を押してください。" : "";
});
(async()=>{
  try{
    const s=window.claude && await claude.use("sample");
    if(!s) throw 0;
    const lim=await s.limits().catch(()=>null);
    if(!lim||!lim.images) throw 0;
    sampleFn=s;
  }catch(e){ $("readBtn").hidden=true }
})();
$("readBtn").onclick=async()=>{
  if(!photoFile||!sampleFn) return;
  const btn=$("readBtn"); btn.disabled=true; $("readMsg").textContent="読み取り中…（30秒ほどかかることがあります）";
  const prompt=`この写真はコンビニのPOS「WinShare」の画面です。上の行に日付（例 2026/10/16）が並んでいます。
「まちかど厨房（販売）」の行（黄色の部分）から、日付ごとに 販売高・値引高・廃棄高 を読み取ってください。
「仕入高」は不要です。「まちかど厨房（食材）」「（包材）」「（廃棄）」の行は使わないでください。
年が「20XX/10/ 7」のように空白がある場合も YYYY-MM-DD にしてください。読めない数字は null。
次のJSONだけで答えてください：
{"days":[{"date":"2026-10-16","sales":27926,"discount":8645,"waste":0}]}`;
  try{
    const res=await sampleFn.json(prompt,{images:photoFile,modelTier:"complex"});
    const days=(res&&Array.isArray(res.days))?res.days:[];
    const got=[];
    days.forEach(d=>{
      const ds=String(d.date||"").slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
      const num=x=>(x===null||x===undefined||x==="")?null:Number(String(x).replace(/,/g,""));
      data[ds]=[num(d.sales),num(d.discount),num(d.waste)]; got.push(ds);
    });
    if(!got.length){ $("readMsg").textContent="数字を読み取れませんでした。画面全体がはっきり写った写真でもう一度ためすか、表に直接入力してください。"; return }
    got.sort(); save();
    const cur0=$("from").value, cur1=$("to").value;
    setRange(got[0]<cur0?got[0]:cur0, got[got.length-1]>cur1?got[got.length-1]:cur1);
    $("readMsg").textContent=`${got.length}日分を入れました（${got[0].slice(5).replace("-","/")}〜${got[got.length-1].slice(5).replace("-","/")}）。写真と見くらべて、ちがう数字は表で直してください。`;
  }catch(e){
    const c=e&&e.code;
    $("readMsg").textContent = c==="not_granted"||c==="sampling_disabled" ? "読み取りが許可されていません。写真を見ながら表に入力してください。"
      : c==="rate_limited" ? "混み合っています。少し待ってからもう一度押してください。"
      : c==="image_rejected" ? "この写真は使えませんでした。別の写真を選んでください。"
      : "うまく読み取れませんでした。もう一度押すか、表に直接入力してください。";
    if(c==="not_granted"||c==="sampling_disabled") btn.hidden=true;
  }finally{ btn.disabled=false }
};


// 作成計画（曜日パターン）
let PLANS=[{name:"パターンA",days:[1,2,3,4,5]},{name:"パターンB",days:[0,6]}];
try{ const p=JSON.parse(localStorage.getItem("kitchen-plans")); if(Array.isArray(p)&&p.length===2) PLANS=p }catch(e){}
const savePlans=()=>{ try{ localStorage.setItem("kitchen-plans",JSON.stringify(PLANS)) }catch(e){} };
function renderPlans(list){
  const box=$("plans"); box.innerHTML="";
  PLANS.forEach((pl,pi)=>{
    const rows=list.filter(ds=>full(data[ds]) && pl.days.includes(parse(ds).getUTCDay())).map(ds=>data[ds]);
    const k=rows.length;
    const sum=i=>rows.reduce((t,v)=>t+v[i],0);
    const S=sum(0), L=rows.reduce((t,v)=>t+lossOf(v),0);
    const need=k?S/T/k:0, now=k?(S+L)/k:0, diff=need-now;
    const names=[1,2,3,4,5,6,0].filter(d=>pl.days.includes(d)).map(d=>W[d]).join("・")||"曜日を選んでください";
    const c=document.createElement("div"); c.className="pcard";
    c.innerHTML=`<div class="pname">${pl.name}（${names}）</div>
      <div class="wds">${[1,2,3,4,5,6,0].map(d=>`<button type="button" id="wd-${pi}-${d}" class="wd ${d===6?'sat':d===0?'sun':''} ${pl.days.includes(d)?'on':''}" data-p="${pi}" data-d="${d}" aria-pressed="${pl.days.includes(d)}">${W[d]}</button>`).join("")}</div>
      ${k?`<div class="pneed"><div class="lab">1日の必要な作成高（平均・目標${tgt()}%）</div><div class="big">${yen(need)}円</div></div>
      <div class="prow"><span>今の作成高（平均）</span><span>${yen(now)}円</span></div>
      <div class="prow"><span>販売高（平均）</span><span>${yen(S/k)}円</span></div>
      <div class="prow"><span>今より</span><span>${pill(diff)}</span></div>
      <div class="prow"><span>計算した日</span><span>${k}日</span></div>`
      :`<div class="pempty">この期間に、選んだ曜日の数字がありません。</div>`}`;
    box.appendChild(c);
  });
}
$("plans").addEventListener("click",e=>{
  const b=e.target.closest(".wd"); if(!b) return;
  const pi=+b.dataset.p, d=+b.dataset.d, other=1-pi;
  const on=PLANS[pi].days.includes(d);
  PLANS[pi].days = on ? PLANS[pi].days.filter(x=>x!==d) : [...PLANS[pi].days,d];
  if(!on) PLANS[other].days=PLANS[other].days.filter(x=>x!==d);
  savePlans(); render();
});

// タブ
const TABS=["sum","plan","day","photo"];
function showTab(t){
  if(!TABS.includes(t)) t="sum";
  TABS.forEach(x=>{ $("pane-"+x).hidden = x!==t; $("tab-"+x).setAttribute("aria-selected", x===t) });
  try{ localStorage.setItem("kitchen-tab",t) }catch(e){}
}
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ showTab(b.dataset.tab); window.scrollTo(0,0) } });
let firstTab=(location.hash||"").slice(1); if(!TABS.includes(firstTab)){ try{ firstTab=localStorage.getItem("kitchen-tab") }catch(e){} }
showTab(firstTab||"sum");
$("rows").addEventListener("change",e=>{
  const t=e.target; if(!t.dataset.d) return;
  const raw=t.value.replace(/[,，円\s]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
  const ds=t.dataset.d, i=+t.dataset.i;
  data[ds]=data[ds]||[null,null,null];
  data[ds][i]= raw===""?null:Number(raw);
  if(data[ds].every(x=>x===null)) delete data[ds];
  save(); render();
});
function setRange(a,b){ $("from").value=a; $("to").value=b; render() }
try{ const t=+localStorage.getItem("kitchen-target"); if(t>=50&&t<100){ T=t/100; $("target").value=t } }catch(e){}
$("target").addEventListener("input",()=>{ const t=+$("target").value; if(t>=50&&t<100){ T=t/100; try{localStorage.setItem("kitchen-target",t)}catch(e){} render() } });
$("from").addEventListener("change",render); $("to").addEventListener("change",render); $("mode").addEventListener("change",render);
$("q1").onclick=()=>setRange("2026-10-11","2026-10-18");
$("q2").onclick=()=>{ const keys=Object.keys(data).sort(); const last=keys[keys.length-1]||"2026-10-16"; const d=parse(last); d.setUTCDate(d.getUTCDate()-6); setRange(iso(d),last) };
$("q3").onclick=()=>{ const keys=Object.keys(data).sort(); setRange(keys[0],keys[keys.length-1]) };
$("reset").onclick=()=>{ data=JSON.parse(JSON.stringify(PHOTO)); save(); render() };
setRange("2026-10-11","2026-10-18");
</script>
